api:
  replicaCount: 2

  image:
    repository: cloudacrrgd.azurecr.io/vulntracker-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

notify:
  replicaCount: 2
  image:
    repository: cloudacrrgd.azurecr.io/vulntracker-notify
    tag: "1.0.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi


serviceAccount:
  create: true
  name: vulntracker


podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

  seccompProfile:
    type: RuntimeDefault


containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL


ingress:
  enabled: true
  className: nginx
  host: vulntracker.example.com


networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

keyVault:
  enabled: true

  name: "vulntracker-kv"

  # Non-secret Azure identifiers.
  tenantId: ""
  clientId: ""

  secretObjects:
    - objectName: vulntracker-app-secret
      objectType: secret
      objectVersion: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1