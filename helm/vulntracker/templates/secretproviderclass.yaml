{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "vulntracker.fullname" . }}-akv
  labels:
    app.kubernetes.io/name: {{ include "vulntracker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    clientID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}

    objects: |
      array:
      {{- range .Values.keyVault.secretObjects }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType }}
          objectVersion: {{ .objectVersion | quote }}
      {{- end }}
{{- end }}