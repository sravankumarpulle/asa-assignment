{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker.serviceAccountName" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.keyVault.enabled }}
    azure.workload.identity/client-id: {{ .Values.keyVault.clientId | quote }}
    {{- end }}
{{- end }}