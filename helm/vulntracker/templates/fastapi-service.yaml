apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-api

  labels:
    app.kubernetes.io/name: vulntracker-api

spec:
  type: {{ .Values.api.service.type }}

  selector:
    app.kubernetes.io/name: vulntracker-api

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.service.port }}
      targetPort: http
