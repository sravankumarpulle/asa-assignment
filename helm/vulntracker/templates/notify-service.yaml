apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-notify

  labels:
    app.kubernetes.io/name: vulntracker-notify

spec:
  type: {{ .Values.notify.service.type }}

  selector:
    app.kubernetes.io/name: vulntracker-notify

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.notify.service.port }}
      targetPort: http
