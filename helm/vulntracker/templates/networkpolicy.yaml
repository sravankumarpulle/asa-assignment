{{- if .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ .Release.Name }}-api-ingress

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vulntracker-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}

      ports:
        - protocol: TCP
          port: 8000

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ .Release.Name }}-notify-ingress

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vulntracker-notify

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vulntracker-api

      ports:
        - protocol: TCP
          port: 3001

{{- end }}
