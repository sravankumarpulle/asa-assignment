apiVersion: v1
kind: Service
metadata:
  name: {{ include "vulntracker.fullname" . }}-api
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- with .Values.fastapi.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.fastapi.service.type }}
  externalTrafficPolicy: {{ .Values.fastapi.service.externalTrafficPolicy }}
  {{- with .Values.fastapi.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.fastapi.service.port }}
      targetPort: http
      protocol: TCP
