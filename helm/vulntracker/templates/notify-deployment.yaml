apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-notify

  labels:
    app.kubernetes.io/name: vulntracker-notify
    app.kubernetes.io/part-of: vulntracker

spec:
  replicas: {{ .Values.notify.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: vulntracker-notify

  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulntracker-notify
        app.kubernetes.io/part-of: vulntracker

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      automountServiceAccountToken: false

      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: notify

          image: "{{ .Values.notify.image.repository }}:{{ .Values.notify.image.tag }}"
          imagePullPolicy: {{ .Values.notify.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

          resources:
            {{- toYaml .Values.notify.resources | nindent 12 }}